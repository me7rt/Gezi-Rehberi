<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fa3">
<title>Gezi Rehberi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gezi Rehberi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css?v=3.1">
</head>
<body>
<header class="top">
  <button class="back" id="back" hidden aria-label="Geri">‹</button>
  <div class="titles">
    <div class="eyebrow" id="eyebrow">Gezi Rehberi</div>
    <h1 id="title">Nereye gidiyorsun?</h1>
  </div>
  <button class="loc" id="locBtn" aria-label="Konumumu kullan"><i></i><span id="locText">Konum kapalı</span></button>
</header>

<main id="home" class="view">
  <input id="search" type="search" placeholder="İl, ilçe ya da yer ara… (ör. Ürgüp)" autocomplete="off" enterkeyhint="search">
  <ul class="list" id="results" hidden></ul>
  <div id="homeMain">
    <button class="near" id="nearBtn">
      <b>Yakınımdaki yerler</b>
      <small id="nearSub">Konumunu aç, sana en yakın gezilecek yerleri sıralayalım</small>
    </button>
    <h2 class="sec">81 il</h2>
    <ul class="ils" id="ilGrid"><li class="empty">Yükleniyor…</li></ul>
  </div>
  <p class="credit" id="ver"></p>
</main>

<main id="city" class="view" hidden>
  <section class="hero" id="hero">
    <div class="heroimg" id="heroImg"></div>
    <small class="pcredit" id="heroCredit"></small>
    <div class="facts" id="heroFacts"></div>
    <p class="text clamp" id="heroText"></p>
    <div class="herolinks"><button class="linkbtn" id="heroMore" hidden>Devamını oku</button><a class="linkbtn" id="heroWiki" target="_blank" rel="noopener" hidden>Vikipedi</a></div>
  </section>
  <div class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="yer" id="tabBtnYer">Gezilecek yerler</button>
    <button role="tab" data-tab="ilce" id="tabBtnIlce">İlçeler</button>
  </div>
  <div id="tabYer">
    <div id="map" class="map"></div>
    <div class="chips" id="chips" role="group" aria-label="Kategori"></div>
    <div class="sort"><span id="count"></span><span class="seg" id="sortSeg"></span></div>
    <ul class="list" id="list"></ul>
    <button class="morebtn" id="moreBtn" hidden>Daha fazla göster</button>
  </div>
  <div id="tabIlce" hidden>
    <ul class="list" id="ilceList"></ul>
  </div>
  <p class="credit">Bilgiler: Vikipedi (CC BY-SA). Fotoğraflar: Wikimedia Commons, yazar ve lisansı fotoğrafın altında. Harita: © OpenStreetMap katkıcıları.</p>
</main>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <div class="photo" id="dPhoto">
      <span class="ph-icon" id="dIcon"></span>
      <span class="ph-img" id="dImg"></span>
      <span class="tag" id="dTag"></span>
      <button class="close" id="dClose" aria-label="Kapat">×</button>
    </div>
    <small class="pcredit" id="dCredit"></small>
    <div class="body">
      <h2 id="dTitle"></h2>
      <div class="facts" id="dFacts"></div>
      <div class="tip" id="dTip" hidden></div>
      <p id="dText" class="text"></p>
      <div class="btns">
        <a class="btn" id="dMap" target="_blank" rel="noopener">Haritada aç</a>
        <a class="btn primary" id="dDir" target="_blank" rel="noopener">Yol tarifi</a>
      </div>
      <a class="more" id="dWiki" target="_blank" rel="noopener">Vikipedi'de devamını oku</a>
    </div>
  </div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js?v=3.1"></script>
</body>
</html>
