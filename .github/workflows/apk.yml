name: Android APK
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Veri hazirla"]
    types: [completed]
  push:
    branches: [main]
    paths: ["docs/**", "assets/**", "capacitor.config.json", "package.json", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    concurrency: { group: apk, cancel-in-progress: true }
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor kur
        run: npm install --no-audit --no-fund
      - name: Android projesi olustur
        run: |
          npx cap add android
          # Konum izni (canlı mesafe için)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml
          npx @capacitor/assets generate --android --iconBackgroundColor '#1f4fa3' --splashBackgroundColor '#1f4fa3' || echo "simge uretilemedi, varsayilan kullanilacak"
          npx cap sync android
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../GeziRehberi.apk
          ls -la ../GeziRehberi.apk
      - name: Indirme linkine yukle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-son --yes --cleanup-tag || true
          gh release create apk-son GeziRehberi.apk --title "Gezi Rehberi (deneme sürümü)" --notes "Arkadaşlarla denemek için Android APK. Kurmak için telefonda 'bilinmeyen kaynaklardan yükleme' izni gerekir. Otomatik üretildi: $(date -u +%Y-%m-%d)" --latest
