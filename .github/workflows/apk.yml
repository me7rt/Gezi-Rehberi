name: Android APK
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Veri hazirla"]
    types: [completed]
  push:
    branches: [main]
    paths: ["docs/**", "assets/**", "capacitor.config.json", "package.json", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    concurrency: { group: apk, cancel-in-progress: true }
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor kur
        run: npm install --no-audit --no-fund
      - name: Android projesi olustur
        run: |
          npx cap add android
          # Konum izni (canlı mesafe için)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml
          npx @capacitor/assets generate --android --iconBackgroundColor '#1f4fa3' --splashBackgroundColor '#1f4fa3' || echo "simge uretilemedi, varsayilan kullanilacak"
          npx cap sync android
          # Google Play en az Android 7 (SDK 24) istiyor
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle
          grep -n 'SdkVersion' android/variables.gradle
      - name: APK derle (imza anahtarı varsa Play paketi de)
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASS }}
        run: |
          cd android
          chmod +x gradlew
          # Her derlemede sürüm numarası artar (Play bunu ister)
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$(node -p "require('../package.json').version")\"/" app/build.gradle
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > ../ks.jks
            ./gradlew assembleRelease bundleRelease --no-daemon
            BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
            $BT/zipalign -f 4 app/build/outputs/apk/release/app-release-unsigned.apk ../hizali.apk
            $BT/apksigner sign --ks ../ks.jks --ks-key-alias upload --ks-pass env:KP --key-pass env:KP --out ../RotaCepte.apk ../hizali.apk
            cp app/build/outputs/bundle/release/app-release.aab ../RotaCepte.aab
            jarsigner -keystore ../ks.jks -storepass "$KP" -keypass "$KP" ../RotaCepte.aab upload
            rm -f ../ks.jks ../hizali.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../RotaCepte.apk
          fi
          ls -la ../RotaCepte.*
      - name: Play paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: play-paketi
          path: RotaCepte.aab
          if-no-files-found: ignore
      - name: Indirme linkine yukle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-son --yes --cleanup-tag || true
          gh release create apk-son RotaCepte.apk --title "Rota Cepte (deneme sürümü)" --notes "Arkadaşlarla denemek için Android APK. Kurmak için telefonda 'bilinmeyen kaynaklardan yükleme' izni gerekir. Otomatik üretildi: $(date -u +%Y-%m-%d)" --latest
